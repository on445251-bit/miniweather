name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-desktop:
    name: Windows desktop (Java 17 + jpackage)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect project directory
        id: paths
        shell: bash
        run: |
          if [ -f desktop/build.ps1 ]; then
            echo "desktop=desktop" >> "$GITHUB_OUTPUT"
          elif [ -f LightWeather/build.ps1 ]; then
            echo "desktop=LightWeather" >> "$GITHUB_OUTPUT"
          else
            echo "::error::desktop/build.ps1 not found"; exit 1
          fi

      - name: Build & package app-image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          & "${{ steps.paths.outputs.desktop }}\build.ps1" -Package
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Show artifacts
        shell: bash
        run: ls -lh "${{ steps.paths.outputs.desktop }}/build/dist"

      - name: Upload desktop zip
        uses: actions/upload-artifact@v4
        with:
          name: lightweather-desktop
          path: ${{ steps.paths.outputs.desktop }}/build/dist/LightWeather-win64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.paths.outputs.desktop }}/build/dist/LightWeather-win64.zip
          fail_on_unmatched_files: false
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
