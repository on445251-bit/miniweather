name: Build WeatherApp APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 默认 GITHUB_TOKEN 需要 contents:write 才能创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 兼容两种仓库结构：
      #   1) 仓库根目录直接是本项目（含 settings.gradle）
      #   2) 本项目在 WeatherApp/ 子目录
      - name: Detect project directory
        id: proj
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "WeatherApp/settings.gradle" ]; then
            echo "dir=WeatherApp" >> "$GITHUB_OUTPUT"
          else
            echo "::error::未找到 settings.gradle，请确认项目位置"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 手动安装 Android SDK（不依赖第三方 setup-android action，更稳定）
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          echo "[INFO] 下载 Command-Line Tools…"
          curl -fSL --retry 3 -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q clt.zip
          rm clt.zip
          # 必须放到 cmdline-tools/latest/ 才是 sdkmanager 期望的标准布局
          mv cmdline-tools latest 2>/dev/null || true
          SDK_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$SDK_BIN:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "[INFO] 接受许可协议…"
          yes | sdkmanager --licenses --sdk_root="$ANDROID_HOME" >/dev/null 2>&1 || true
          echo "[INFO] 安装编译包（首次约数百 MB）…"
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.proj.outputs.dir }}
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-release
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 可选：打 tag（如 v1.0）触发时，自动生成 GitHub Release 并附 APK
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
