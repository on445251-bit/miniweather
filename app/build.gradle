plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.weather'
    compileSdk 34

    // 读取本地签名配置（可选；不存在则跳过，Release 包将不签名）
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    defaultConfig {
        applicationId "com.example.weather"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 若提供了 keystore.properties，则配置签名；否则 Release 包不签名（CI 用 Debug 包分发）
    if (keystoreProps.containsKey('STORE_FILE')) {
        signingConfigs {
            release {
                storeFile file(keystoreProps['STORE_FILE'])
                storePassword keystoreProps['STORE_PASSWORD']
                keyAlias keystoreProps['KEY_ALIAS']
                keyPassword keystoreProps['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps.containsKey('STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            // Debug 包自带 Android 调试签名，可直接安装
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
